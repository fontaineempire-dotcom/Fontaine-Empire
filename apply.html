<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Apply | FONTAINE EMPIRE</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#173b52;
  background:linear-gradient(#fff,#e9faff);
}

a{
  text-decoration:none;
  color:inherit;
}

/* NAVIGATION */
nav{
  height:76px;
  padding:0 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#ffffffee;
  backdrop-filter:blur(12px);
  border-bottom:1px solid #cfeaf4;
  position:sticky;
  top:0;
  z-index:5;
}

.brand{
  font-weight:900;
  letter-spacing:.08em;
  display:flex;
  align-items:center;
  gap:10px;
}

.brand img{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:contain;
}

.links{
  display:flex;
  gap:16px;
  font-weight:700;
  font-size:14px;
}

.links a:hover{
  color:#1689d5;
}

/* MOBILE MENU */
.menu-toggle{
  display:none;
  background:#fff;
  border:1px solid #b9dcea;
  border-radius:10px;
  padding:9px 12px;
  color:#0b527c;
  font-size:18px;
  cursor:pointer;
}

.mobile-links{
  display:none;
}

/* PAGE */
.page{
  width:min(1100px,92%);
  margin:auto;
  padding:75px 0;
}

.kicker{
  text-transform:uppercase;
  letter-spacing:.22em;
  font-size:13px;
  font-weight:900;
  color:#0b527c;
}

h1{
  font-size:clamp(2.7rem,6vw,5rem);
  line-height:.92;
  margin:15px 0;
  color:#0b527c;
}

.lead{
  font-size:1.15rem;
  max-width:760px;
}

/* APPLICATION FORM */
form{
  max-width:800px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:35px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.full{
  grid-column:1/-1;
}

label{
  font-weight:700;
}

input,
textarea{
  padding:13px;
  border:1px solid #b9dcea;
  border-radius:10px;
  font:inherit;
  background:#fff;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#1689d5;
  box-shadow:0 0 0 3px rgba(22,137,213,.12);
}

textarea{
  min-height:150px;
  resize:vertical;
}

.submit{
  grid-column:1/-1;
  border:0;
  border-radius:999px;
  padding:14px;
  background:#1689d5;
  color:#fff;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

.submit:hover{
  background:#0b6fae;
}

/* FOOTER */
footer{
  padding:28px 4%;
  border-top:1px solid #cfeaf4;
  display:flex;
  justify-content:space-between;
}

/* MOBILE */
@media(max-width:800px){

  nav{
    height:auto;
    min-height:72px;
    position:sticky;
  }

  .brand{
    font-size:12px;
    gap:8px;
  }

  .brand img{
    width:38px;
    height:38px;
  }

  .links{
    display:none;
  }

  .menu-toggle{
    display:block;
  }

  .mobile-links{
    position:absolute;
    top:72px;
    left:4%;
    right:4%;
    display:none;
    flex-direction:column;
    gap:0;
    background:#fff;
    border:1px solid #cfeaf4;
    border-radius:0 0 14px 14px;
    box-shadow:0 12px 25px rgba(11,82,124,.12);
    overflow:hidden;
  }

  .mobile-links.open{
    display:flex;
  }

  .mobile-links a{
    padding:14px 18px;
    border-bottom:1px solid #e4f2f7;
    font-weight:800;
  }

  .mobile-links a:last-child{
    border-bottom:0;
  }

  form{
    grid-template-columns:1fr;
  }

  .full,
  .submit{
    grid-column:auto;
  }

  footer{
    flex-direction:column;
    gap:8px;
  }
}
</style>
</head>

<body>

<!-- NAVIGATION -->
<nav>

  <a class="brand" href="index.html">
    <img src="fep-logo.jpeg" alt="Fontaine Empire logo">
    <span>FONTAINE EMPIRE</span>
  </a>

  <div class="links">
    <a href="index.html">Home</a>
    <a href="music.html">Music</a>
    <a href="gallery.html">Gallery</a>
    <a href="artists.html">Artists</a>
    <a href="merch.html">Merch</a>
    <a href="apply.html">Apply</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Open menu"
    aria-expanded="false">
    ☰
  </button>

  <div class="mobile-links">
    <a href="index.html">Home</a>
    <a href="music.html">Music</a>
    <a href="gallery.html">Gallery</a>
    <a href="artists.html">Artists</a>
    <a href="merch.html">Merch</a>
    <a href="apply.html">Apply</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

</nav>

<!-- APPLY PAGE -->
<main>

<section class="page">

  <div class="kicker">Artist Applications</div>

  <h1>Apply</h1>

  <p class="lead">
    Have a sound worth hearing?
    Submit your information and tell Fontaine Empire about your music.
  </p>

  <form>

    <div class="field">
      <label for="first-name">First Name</label>
      <input
        id="first-name"
        name="first_name"
        type="text"
        autocomplete="given-name"
        required>
    </div>

    <div class="field">
      <label for="last-name">Last Name</label>
      <input
        id="last-name"
        name="last_name"
        type="text"
        autocomplete="family-name"
        required>
    </div>

    <div class="field">
      <label for="artist-name">Artist Name</label>
      <input
        id="artist-name"
        name="artist_name"
        type="text"
        required>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required>
    </div>

    <div class="field full">
      <label for="phone">Phone Number</label>
      <input
        id="phone"
        name="phone"
        type="tel"
        autocomplete="tel"
        required>
    </div>

    <div class="field full">
      <label for="genre">Genre / Type of Music</label>
      <input
        id="genre"
        name="genre"
        type="text"
        placeholder="e.g. Soca, Dancehall, Hip-Hop, R&B"
        required>
    </div>

    <button class="submit" type="submit">
      Submit Artist Application →
    </button>

  </form>

</section>

</main>

<!-- FOOTER -->
<footer>
  <span>© 2026 FONTAINE EMPIRE</span>
  <span>“Music to Save the World”</span>
</footer>

<script>
const toggle = document.querySelector(".menu-toggle");
const mobileMenu = document.querySelector(".mobile-links");

if(toggle && mobileMenu){

  toggle.addEventListener("click", () => {

    const isOpen = mobileMenu.classList.toggle("open");

    toggle.setAttribute(
      "aria-expanded",
      isOpen
    );

  });

}
</script>

</body>
</html>
