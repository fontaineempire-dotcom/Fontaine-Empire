<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  background:#dceeff;

  overflow-x:hidden;
}

a{

/* =========================================================
   HOME
========================================================= */

.home{
  position:relative;

  width:100vw;

  height:100vh;
  height:100svh;

  min-height:520px;

  overflow:hidden;

  background:#dceeff;
}


/* =========================================================
   DESKTOP BACKGROUND
========================================================= */

.home-image{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center center;

  display:block;

  user-select:none;

  -webkit-user-drag:none;
}


/* =========================================================
   DESKTOP NAVIGATION
========================================================= */

.desktop-nav{
  position:absolute;

  top:3%;
  right:4%;

  display:flex;

  align-items:center;

  gap:24px;
}

.desktop-nav a{
  color:#0b527c;

  text-decoration:none;

  font-size:15px;

  font-weight:700;

  white-space:nowrap;

  transition:.2s ease;
}

.desktop-nav a:hover{
  color:#1689d5;
}


/* =========================================================
   MOBILE BRAND
========================================================= */

.mobile-brand{
  display:none;
}


/* =========================================================
   MOBILE HAMBURGER
========================================================= */

.mobile-menu-button{
  display:none;

  top:18px;
  right:18px;

  z-index:100;

  width:58px;
  height:58px;

  border-radius:15px;

}


/* =========================================================
   MOBILE MENU
========================================================= */

  position:absolute;

.mobile-menu.open{

}

}

.mobile-menu a:last-child{

.mobile-menu a:active{

========================================================= */

.hotspot{

.home-link:nth-of-type(4){

  ======================================================= */

<!-- =======================================================
     MOBILE MENU SCRIPT
======================================================= -->

<script>


const menuButton =
  document.getElementById("mobileMenuButton");


const mobileMenu =
  document.getElementById("mobileMenu");


/* =========================================================
   OPEN / CLOSE MENU
========================================================= */

menuButton.addEventListener("click", function(){

  const opened =
    mobileMenu.classList.toggle("open");


  menuButton.setAttribute(
    "aria-expanded",
    opened
  );


  menuButton.setAttribute(
    "aria-label",
    opened
      ? "Close menu"
      : "Open menu"
  );


  menuButton.textContent =
    opened
      ? "×"
      : "☰";

});


/* =========================================================
   CLOSE MENU AFTER SELECTING PAGE
========================================================= */

const mobileLinks =
  mobileMenu.querySelectorAll("a");


mobileLinks.forEach(function(link){

  link.addEventListener("click", function(){

    mobileMenu.classList.remove("open");


    menuButton.textContent =
      "☰";


    menuButton.setAttribute(
      "aria-expanded",
      "false"
    );


    menuButton.setAttribute(
      "aria-label",
      "Open menu"
    );

  });

});


/* =========================================================
   CLOSE MENU WHEN TAPPING OUTSIDE
========================================================= */

document.addEventListener("click", function(event){

  if(
    mobileMenu.classList.contains("open") &&
    !mobileMenu.contains(event.target) &&
    !menuButton.contains(event.target)
  ){

    mobileMenu.classList.remove("open");


    menuButton.textContent =
      "☰";


    menuButton.setAttribute(
      "aria-expanded",
      "false"
    );


    menuButton.setAttribute(
      "aria-label",
      "Open menu"
    );

  }

});

</script>
