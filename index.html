<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FONTAINE EMPIRE | Music to Save the World</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dceeff;
  font-family:Arial,sans-serif;
}

.home{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#dceeff;
}

/* YOUR REFERENCE IMAGE */
.home-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

/* Invisible clickable areas over the words */
.hotspot{
  position:absolute;
  z-index:10;
  display:block;
  background:transparent;
  border:0;
  text-decoration:none;
}

/* TOP NAVIGATION */

.home-link:nth-of-type(1){
  top:3%;
  left:49%;
  width:5%;
  height:6%;
}

.home-link:nth-of-type(2){
  top:3%;
  left:54.5%;
  width:5%;
  height:6%;
}

.home-link:nth-of-type(3){
  top:3%;
  left:60%;
  width:6%;
  height:6%;
}

.home-link:nth-of-type(4){
  top:3%;
  left:66%;
  width:6%;
  height:6%;
}

.home-link:nth-of-type(5){
  top:3%;
  left:72%;
  width:5.5%;
  height:6%;
}

.home-link:nth-of-type(6){
  top:3%;
  left:78%;
  width:5%;
  height:6%;
}

.home-link:nth-of-type(7){
  top:3%;
  left:83%;
  width:5.5%;
  height:6%;
}

.home-link:nth-of-type(8){
  top:3%;
  left:89%;
  width:6%;
  height:6%;
}

/* SUBMIT YOUR MUSIC BUTTON */

.submit-link{
  left:7.5%;
  top:71%;
  width:14%;
  height:7%;
}

/* OUR ORIGIN STORY BUTTON */

.origin-link{
  left:22.5%;
  top:71%;
  width:14%;
  height:7%;
}

/* Makes the clickable areas easier to use on phones */
@media(max-width:700px){

  .home-image{
    object-position:center center;
  }

  .home-link{
    top:2.5%;
    height:8%;
  }

  .submit-link{
    left:5%;
    top:70%;
    width:28%;
    height:10%;
  }

  .origin-link{
    left:34%;
    top:70%;
    width:25%;
    height:10%;
  }
}
</style>
</head>

<body>

<main class="home">

  <!--
    IMPORTANT:
    Put your reference image in the same folder as this index.html
    and name it:

    home-reference.png
  -->

  <img
    class="home-image"
    src="home-reference.png"
    alt="Fontaine Empire"
  >

  <!-- TOP NAVIGATION -->

  <a
    class="hotspot home-link"
    href="index.html"
    aria-label="Home">
  </a>

  <a
    class="hotspot home-link"
    href="music.html"
    aria-label="Music">
  </a>

  <a
    class="hotspot home-link"
    href="gallery.html"
    aria-label="Gallery">
  </a>

  <a
    class="hotspot home-link"
    href="artists.html"
    aria-label="Artists">
  </a>

  <a
    class="hotspot home-link"
    href="merch.html"
    aria-label="Merch">
  </a>

  <a
    class="hotspot home-link"
    href="apply.html"
    aria-label="Apply">
  </a>

  <a
    class="hotspot home-link"
    href="about.html"
    aria-label="About">
  </a>

  <a
    class="hotspot home-link"
    href="contact.html"
    aria-label="Contact">
  </a>


  <!-- BUTTONS -->

  <a
    class="hotspot submit-link"
    href="apply.html"
    aria-label="Submit Your Music">
  </a>

  <a
    class="hotspot origin-link"
    href="about.html"
    aria-label="Our Origin Story">
  </a>

</main>

</body>
</html>
