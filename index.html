<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Fontaine Empire | Music to Save the World</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#dceeff;
  font-family:Arial, Helvetica, sans-serif;
}

/* =========================================
   HOME PAGE
========================================= */

.home{
  position:relative;
  width:100%;
  min-height:100vh;
  background:#dceeff;
  overflow:hidden;
}

/* =========================================
   REFERENCE IMAGE
========================================= */

.home-image{
  display:block;
  width:100%;
  height:auto;
  min-height:100vh;
  object-fit:cover;
  object-position:center center;
  user-select:none;
  -webkit-user-drag:none;
}

/* =========================================
   INVISIBLE CLICKABLE AREAS
========================================= */

.hotspot{
  position:absolute;
  z-index:10;
  display:block;
  background:transparent;
  border:0;
  text-decoration:none;
  cursor:pointer;
}

/* Keyboard accessibility */
.hotspot:focus-visible{
  outline:3px solid #1676c5;
  outline-offset:4px;
  border-radius:5px;
}

/* =========================================
   TOP NAVIGATION
========================================= */

.home-link:nth-of-type(1){
  top:2.5%;
  left:49%;
  width:5%;
  height:6%;
}

.home-link:nth-of-type(2){
  top:2.5%;
  left:54.5%;
  width:5%;
  height:6%;
}

.home-link:nth-of-type(3){
  top:2.5%;
  left:60%;
  width:6%;
  height:6%;
}

.home-link:nth-of-type(4){
  top:2.5%;
  left:66%;
  width:6%;
  height:6%;
}

.home-link:nth-of-type(5){
  top:2.5%;
  left:72%;
  width:5.5%;
  height:6%;
}

.home-link:nth-of-type(6){
  top:2.5%;
  left:78%;
  width:5%;
  height:6%;
}

.home-link:nth-of-type(7){
  top:2.5%;
  left:83%;
  width:5.5%;
  height:6%;
}

.home-link:nth-of-type(8){
  top:2.5%;
  left:89%;
  width:6%;
  height:6%;
}

/* =========================================
   HOME BUTTONS
========================================= */

.submit-link{
  left:7.5%;
  top:71%;
  width:14%;
  height:7%;
}

.origin-link{
  left:22.5%;
  top:71%;
  width:14%;
  height:7%;
}

/* =========================================
   MOBILE MENU
========================================= */

.mobile-menu-button{
  display:none;
}

.mobile-menu{
  display:none;
}

/* =========================================
   TABLET
========================================= */

@media (max-width:900px){

  .home-image{
    min-height:0;
    width:100%;
    height:auto;
    object-fit:contain;
  }

  .home{
    min-height:auto;
  }

  .home-link:nth-of-type(1){
    left:48%;
  }

  .home-link:nth-of-type(2){
    left:54%;
  }

  .home-link:nth-of-type(3){
    left:60%;
  }

  .home-link:nth-of-type(4){
    left:66%;
  }

  .home-link:nth-of-type(5){
    left:72%;
  }

  .home-link:nth-of-type(6){
    left:78%;
  }

  .home-link:nth-of-type(7){
    left:83%;
  }

  .home-link:nth-of-type(8){
    left:89%;
  }
}

/* =========================================
   PHONE
========================================= */

@media (max-width:600px){

  body{
    overflow-x:hidden;
  }

  .home{
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:#dceeff;
  }

  /*
     Keep the ENTIRE reference image visible
     on phone screens instead of cropping it.
  */

  .home-image{
    width:100%;
    height:auto;
    min-height:0;
    object-fit:contain;
    object-position:top center;
  }

  /*
     The original navigation in the reference
     becomes very small on phones, so we provide
     a mobile menu as well.
  */

  .mobile-menu-button{
    display:flex;
    position:fixed;
    top:15px;
    right:15px;
    z-index:100;

    width:48px;
    height:48px;

    align-items:center;
    justify-content:center;

    border:1px solid rgba(20,80,150,.35);
    border-radius:10px;

    background:rgba(220,238,255,.92);
    color:#174d87;

    font-size:24px;
    font-weight:bold;

    box-shadow:0 5px 20px rgba(0,0,0,.12);

    cursor:pointer;
  }

  .mobile-menu{
    position:fixed;
    top:72px;
    right:15px;

    z-index:99;

    width:190px;

    padding:10px;

    background:rgba(235,246,255,.98);

    border:1px solid rgba(20,80,150,.25);
    border-radius:12px;

    box-shadow:0 10px 35px rgba(0,0,0,.18);
  }

  .mobile-menu.show{
    display:block;
  }

  .mobile-menu a{
    display:block;

    padding:13px 14px;

    color:#174d87;

    font-weight:bold;
    font-size:14px;

    text-decoration:none;

    border-radius:7px;
  }

  .mobile-menu a:hover,
  .mobile-menu a:active{
    background:#d5eaff;
  }

  /*
     Make the original image navigation clickable
     but slightly easier to tap on phones.
  */

  .home-link{
    height:8%;
  }

  /*
     Bottom buttons on the reference image.
  */

  .submit-link{
    left:7%;
    top:70%;
    width:15%;
    height:9%;
  }

  .origin-link{
    left:22%;
    top:70%;
    width:15%;
    height:9%;
  }
}

/* =========================================
   VERY SMALL PHONES
========================================= */

@media (max-width:380px){

  .mobile-menu-button{
    width:44px;
    height:44px;
    top:10px;
    right:10px;
  }

  .mobile-menu{
    top:62px;
    right:10px;
    width:175px;
  }

}
</style>
</head>

<body>

<main class="home" aria-label="Fontaine Empire Home">

  <!-- REFERENCE IMAGE -->
  <img
    class="home-image"
    src="home-reference.png"
    alt="Fontaine Empire — Music to Save the World"
  >

  <!-- =====================================
       DESKTOP / TABLET NAVIGATION
  ====================================== -->

  <a
    class="hotspot home-link"
    href="index.html"
    aria-label="Home">
  </a>

  <a
    class="hotspot home-link"
    href="music.html"
    aria-label="Music">
  </a>

  <a
    class="hotspot home-link"
    href="gallery.html"
    aria-label="Gallery">
  </a>

  <a
    class="hotspot home-link"
    href="artists.html"
    aria-label="Artists">
  </a>

  <a
    class="hotspot home-link"
    href="merch.html"
    aria-label="Merch">
  </a>

  <a
    class="hotspot home-link"
    href="apply.html"
    aria-label="Apply">
  </a>

  <a
    class="hotspot home-link"
    href="about.html"
    aria-label="About">
  </a>

  <a
    class="hotspot home-link"
    href="contact.html"
    aria-label="Contact">
  </a>


  <!-- =====================================
       REFERENCE IMAGE BUTTONS
  ====================================== -->

  <a
    class="hotspot submit-link"
    href="apply.html"
    aria-label="Submit Your Music">
  </a>

  <a
    class="hotspot origin-link"
    href="about.html"
    aria-label="Our Origin Story">
  </a>


  <!-- =====================================
       MOBILE MENU
  ====================================== -->

  <button
    class="mobile-menu-button"
    id="mobileMenuButton"
    aria-label="Open navigation menu"
    aria-expanded="false">
    ☰
  </button>

  <nav
    class="mobile-menu"
    id="mobileMenu"
    aria-label="Mobile navigation">

    <a href="index.html">Home</a>
    <a href="music.html">Music</a>
    <a href="gallery.html">Gallery</a>
    <a href="artists.html">Artists</a>
    <a href="merch.html">Merch</a>
    <a href="apply.html">Apply</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>

  </nav>

</main>


<script>

const menuButton =
  document.getElementById("mobileMenuButton");

const mobileMenu =
  document.getElementById("mobileMenu");

menuButton.addEventListener("click", function(){

  const isOpen =
    mobileMenu.classList.toggle("show");

  menuButton.setAttribute(
    "aria-expanded",
    isOpen ? "true" : "false"
  );

  menuButton.textContent =
    isOpen ? "✕" : "☰";

});


/* Close menu after selecting a page */

mobileMenu.querySelectorAll("a").forEach(function(link){

  link.addEventListener("click", function(){

    mobileMenu.classList.remove("show");

    menuButton.setAttribute(
      "aria-expanded",
      "false"
    );

    menuButton.textContent = "☰";

  });

});

</script>

</body>
</html>
