<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FONTAINE EMPIRE | Music to Save the World</title>

<meta
  name="description"
  content="Fontaine Empire — Music to Save the World. The Sound. The Vision. The Empire."
>

<style>

/* ==============================
   BASIC
============================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#dceeff;
}

body{
  font-family:Arial,sans-serif;
}


/* ==============================
   HOME
============================== */

.home{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:520px;
  overflow:hidden;
  background:#dceeff;
}

.home-image{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  display:block;

  user-select:none;
  -webkit-user-drag:none;
}


/* ==============================
   CLICKABLE HOTSPOTS
============================== */

.hotspot{
  position:absolute;

  display:block;

  z-index:5;

  background:transparent;
  border:0;
  outline:0;

  color:transparent;

  text-decoration:none;

  cursor:pointer;
}

.hotspot span{
  color:transparent;
}

.hotspot:focus-visible{
  outline:2px solid #1676c5;
  outline-offset:4px;
  border-radius:4px;
}


/* ==============================
   DESKTOP TOP NAVIGATION
============================== */

.home-link{
  top:3%;
  height:5.8%;
}

.home-link:nth-of-type(1){
  left:49%;
  width:5.1%;
}

.home-link:nth-of-type(2){
  left:54.7%;
  width:5%;
}

.home-link:nth-of-type(3){
  left:60%;
  width:5.8%;
}

.home-link:nth-of-type(4){
  left:66%;
  width:5.8%;
}

.home-link:nth-of-type(5){
  left:72%;
  width:5.5%;
}

.home-link:nth-of-type(6){
  left:78%;
  width:4.8%;
}

.home-link:nth-of-type(7){
  left:83.2%;
  width:5.2%;
}

.home-link:nth-of-type(8){
  left:89%;
  width:5.7%;
}


/* ==============================
   DESKTOP BOTTOM BUTTONS
============================== */

.submit-link{
  left:4%;
  top:71.5%;
  width:16.5%;
  height:8.5%;
}

.origin-link{
  left:21.2%;
  top:71.5%;
  width:14%;
  height:8.5%;
}


/* ==============================
   MOBILE MENU BUTTON
============================== */

.menu-toggle{
  display:none;

  position:fixed;

  top:15px;
  right:15px;

  z-index:30;

  width:48px;
  height:48px;

  background:#ffffffee;

  border:1px solid #b9dcea;

  border-radius:12px;

  color:#0b527c;

  font-size:24px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 20px rgba(11,82,124,.15);
}


/* ==============================
   MOBILE MENU
============================== */

.mobile-links{
  display:none;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

  html,
  body{
    width:100%;
    height:auto;

    min-height:100%;

    overflow-x:hidden;
    overflow-y:auto;

    background:#dceeff;
  }


  /* 
     IMPORTANT:
     The mobile page is now allowed
     to be as tall as the full image.
  */

  .home{
    position:relative;

    width:100vw;

    height:auto;
    min-height:0;

    overflow:visible;

    background:#dceeff;
  }


  /*
     Show the ENTIRE image.

     The image keeps its natural
     proportions instead of being
     stretched/cropped.
  */

  .home-image{
    position:relative;

    top:auto;
    left:auto;
    right:auto;
    bottom:auto;

    width:100%;
    height:auto;

    display:block;

    object-fit:contain;
    object-position:top center;

    background:#dceeff;
  }


  /* 
     Hide desktop navigation hotspots
     on the phone.

     The hamburger menu handles navigation.
  */

  .home-link{
    display:none;
  }


  /* ============================
     MOBILE BOTTOM BUTTONS
  ============================ */

  /*
     These remain invisible clickable
     areas over the actual buttons
     in the image.
  */

  .submit-link{
    display:block;

    left:4%;

    /*
      Position is based on the
      full image now being displayed.
    */
    top:78%;

    width:31%;
    height:9%;

    z-index:10;
  }

  .origin-link{
    display:block;

    left:39%;

    top:78%;

    width:29%;
    height:9%;

    z-index:10;
  }


  /* ============================
     HAMBURGER
  ============================ */

  .menu-toggle{
    display:block;
  }


  /* ============================
     DROPDOWN MENU
  ============================ */

  .mobile-links{
    position:fixed;

    top:72px;

    left:4%;
    right:4%;

    z-index:25;

    display:none;

    flex-direction:column;

    background:#fff;

    border:1px solid #cfeaf4;

    border-radius:0 0 14px 14px;

    box-shadow:
      0 12px 25px rgba(11,82,124,.15);

    overflow:hidden;
  }


  .mobile-links.open{
    display:flex;
  }


  .mobile-links a{
    display:block;

    padding:14px 18px;

    border-bottom:1px solid #e4f2f7;

    color:#173b52;

    font-weight:800;

    text-decoration:none;
  }


  .mobile-links a:last-child{
    border-bottom:0;
  }


  .mobile-links a:active{
    background:#e9faff;
  }

}

</style>

</head>


<body>


<!-- ==================================
     HOMEPAGE
================================== -->

<main
  class="home"
  aria-label="Fontaine Empire Home"
>


  <!-- HOMEPAGE IMAGE -->

  <img
    class="home-image"
    src="home-reference.png"
    alt="Fontaine Empire homepage — Music to Save the World"
  >


  <!-- ==================================
       DESKTOP NAVIGATION HOTSPOTS
  ================================== -->

  <a
    class="hotspot home-link"
    href="index.html"
    aria-label="Home"
  >
    <span>Home</span>
  </a>


  <a
    class="hotspot home-link"
    href="music.html"
    aria-label="Music"
  >
    <span>Music</span>
  </a>


  <a
    class="hotspot home-link"
    href="gallery.html"
    aria-label="Gallery"
  >
    <span>Gallery</span>
  </a>


  <a
    class="hotspot home-link"
    href="artists.html"
    aria-label="Artists"
  >
    <span>Artists</span>
  </a>


  <a
    class="hotspot home-link"
    href="merch.html"
    aria-label="Merch"
  >
    <span>Merch</span>
  </a>


  <a
    class="hotspot home-link"
    href="apply.html"
    aria-label="Apply"
  >
    <span>Apply</span>
  </a>


  <a
    class="hotspot home-link"
    href="about.html"
    aria-label="About"
  >
    <span>About</span>
  </a>


  <a
    class="hotspot home-link"
    href="contact.html"
    aria-label="Contact"
  >
    <span>Contact</span>
  </a>


  <!-- ==================================
       SUBMIT YOUR MUSIC
  ================================== -->

  <a
    class="hotspot submit-link"
    href="apply.html"
    aria-label="Submit Your Music"
  >
    <span>Submit Your Music</span>
  </a>


  <!-- ==================================
       ORIGIN STORY
  ================================== -->

  <a
    class="hotspot origin-link"
    href="about.html"
    aria-label="Our Origin Story"
  >
    <span>Our Origin Story</span>
  </a>


</main>


<!-- ==================================
     MOBILE TOGGLE BUTTON
================================== -->

<button
  class="menu-toggle"
  type="button"
  aria-label="Open menu"
  aria-expanded="false"
>
  ☰
</button>


<!-- ==================================
     MOBILE NAVIGATION
================================== -->

<nav class="mobile-links">

  <a href="index.html">
    Home
  </a>

  <a href="music.html">
    Music
  </a>

  <a href="gallery.html">
    Gallery
  </a>

  <a href="artists.html">
    Artists
  </a>

  <a href="merch.html">
    Merch
  </a>

  <a href="apply.html">
    Apply
  </a>

  <a href="about.html">
    About
  </a>

  <a href="contact.html">
    Contact
  </a>

</nav>


<!-- ==================================
     MOBILE MENU SCRIPT
================================== -->

<script>

const toggle =
  document.querySelector(".menu-toggle");

const mobileMenu =
  document.querySelector(".mobile-links");


if(toggle && mobileMenu){

  toggle.addEventListener("click", function(){

    const isOpen =
      mobileMenu.classList.toggle("open");


    toggle.setAttribute(
      "aria-expanded",
      isOpen
    );


    toggle.setAttribute(
      "aria-label",
      isOpen
        ? "Close menu"
        : "Open menu"
    );


    toggle.textContent =
      isOpen
        ? "✕"
        : "☰";

  });


  /*
     Close menu after selecting
     a page.
  */

  const mobileLinks =
    mobileMenu.querySelectorAll("a");


  mobileLinks.forEach(function(link){

    link.addEventListener("click", function(){

      mobileMenu.classList.remove("open");

      toggle.setAttribute(
        "aria-expanded",
        "false"
      );

      toggle.setAttribute(
        "aria-label",
        "Open menu"
      );

      toggle.textContent = "☰";

    });

  });

}

</script>


</body>
</html>
