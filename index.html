<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>FONTAINE EMPIRE | Music to Save the World</title>

<meta name="description"
      content="Fontaine Empire — Music to Save the World. The Sound. The Vision. The Empire.">

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#dceeff;
  overflow-x:hidden;
}


/* =========================================================
   HOME
========================================================= */

.home{
  position:relative;

  width:100vw;
  height:100vh;
  height:100svh;

  min-height:520px;

  overflow:hidden;

  background:#dceeff;
}


/* =========================================================
   DESKTOP BACKGROUND
========================================================= */

.home-image{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center center;

  display:block;

  user-select:none;
  -webkit-user-drag:none;
}


/* =========================================================
   DESKTOP NAVIGATION
========================================================= */

.desktop-nav{
  position:absolute;

  top:3%;
  right:4%;

  z-index:20;

  display:flex;
  align-items:center;

  gap:24px;
}

.desktop-nav a{
  color:#0b527c;

  text-decoration:none;

  font-size:15px;
  font-weight:700;

  white-space:nowrap;

  transition:.2s ease;
}

.desktop-nav a:hover{
  color:#1689d5;
}


/* =========================================================
   MOBILE HAMBURGER
========================================================= */

.mobile-menu-button{
  display:none;

  position:absolute;

  top:18px;
  right:18px;

  z-index:100;

  width:58px;
  height:58px;

  border:none;
  border-radius:15px;

  background:#ffffff;

  box-shadow:
    0 8px 25px rgba(11,82,124,.15);

  color:#0b527c;

  font-size:30px;

  line-height:1;

  cursor:pointer;
}


/* =========================================================
   MOBILE MENU
========================================================= */

.mobile-menu{
  display:none;

  position:absolute;

  top:88px;
  left:18px;
  right:18px;

  z-index:90;

  background:rgba(255,255,255,.97);

  border:1px solid #cfeaf4;

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 15px 40px rgba(11,82,124,.18);
}

.mobile-menu.open{
  display:flex;

  flex-direction:column;
}

.mobile-menu a{
  padding:17px 20px;

  border-bottom:1px solid #e1f1f7;

  color:#0b527c;

  text-decoration:none;

  font-size:17px;
  font-weight:800;
}

.mobile-menu a:last-child{
  border-bottom:none;
}

.mobile-menu a:active{
  background:#e9f8ff;
}


/* =========================================================
   DESKTOP HOTSPOTS
========================================================= */

.hotspot{
  position:absolute;

  display:block;

  z-index:10;

  background:transparent;

  border:0;
  outline:0;

  color:transparent;

  text-decoration:none;
}


/* Desktop navigation hotspot positions */

.home-link{
  top:3%;
  height:5.8%;
}

.home-link:nth-of-type(1){
  left:49%;
  width:5.1%;
}

.home-link:nth-of-type(2){
  left:54.7%;
  width:5%;
}

.home-link:nth-of-type(3){
  left:60%;
  width:5.8%;
}

.home-link:nth-of-type(4){
  left:66%;
  width:5.8%;
}

.home-link:nth-of-type(5){
  left:72%;
  width:5.5%;
}

.home-link:nth-of-type(6){
  left:78%;
  width:4.8%;
}

.home-link:nth-of-type(7){
  left:83.2%;
  width:5.2%;
}

.home-link:nth-of-type(8){
  left:89%;
  width:5.7%;
}


/* Desktop buttons */

.submit-link{
  left:4%;
  top:69%;

  width:16.5%;
  height:8.5%;
}

.origin-link{
  left:21.2%;
  top:69%;

  width:14%;
  height:8.5%;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  html,
  body{
    width:100%;
    height:100%;

    overflow-x:hidden;
  }


  .home{
    width:100vw;

    height:100svh;

    min-height:600px;

    overflow:hidden;

    background:#dceeff;
  }


  /* -------------------------------------------------------
     MOBILE BACKGROUND

     Instead of stretching/cropping the desktop design,
     the complete artwork is fitted to the phone.
  ------------------------------------------------------- */

  .home-image{
    width:100%;
    height:100%;

    object-fit:contain;

    object-position:center center;

    background:#dceeff;
  }


  /* -------------------------------------------------------
     HIDE DESKTOP NAV
  ------------------------------------------------------- */

  .desktop-nav{
    display:none;
  }


  /* -------------------------------------------------------
     HAMBURGER
  ------------------------------------------------------- */

  .mobile-menu-button{
    display:flex;

    align-items:center;
    justify-content:center;
  }


  /* -------------------------------------------------------
     HIDE DESKTOP HOTSPOTS
  ------------------------------------------------------- */

  .hotspot{
    display:none;
  }


  /* -------------------------------------------------------
     MOBILE TEXT / CONTENT OVERLAY

     This gives the important wording its own centered
     position on phones so it cannot run off-screen.
  ------------------------------------------------------- */

  .mobile-content{
    position:absolute;

    z-index:30;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:88%;

    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
  }


  .mobile-kicker{
    margin-bottom:8px;

    color:#15568c;

    font-size:11px;
    font-weight:900;

    letter-spacing:.16em;

    text-transform:uppercase;
  }


  .mobile-title{
    margin:0;

    color:#e4a900;

    font-size:clamp(2.4rem,13vw,4rem);

    line-height:.9;

    font-weight:900;

    letter-spacing:-.04em;

    text-align:center;
  }


  .mobile-tagline{
    margin:18px 0 0;

    color:#0b527c;

    font-size:clamp(1rem,5vw,1.35rem);

    font-weight:800;

    line-height:1.3;
  }


  .mobile-subtitle{
    margin:15px 0 0;

    color:#15568c;

    font-size:11px;

    font-weight:800;

    letter-spacing:.18em;

    text-transform:uppercase;

    line-height:1.5;
  }


  /* -------------------------------------------------------
     MOBILE BUTTONS
  ------------------------------------------------------- */

  .mobile-buttons{
    margin-top:25px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:10px;

    width:100%;
  }


  .mobile-button{
    display:flex;

    align-items:center;
    justify-content:center;

    min-height:46px;

    padding:0 18px;

    border-radius:25px;

    text-decoration:none;

    font-size:12px;

    font-weight:800;

    white-space:nowrap;
  }


  .mobile-button.primary{
    background:#086fc9;

    color:#fff;

    box-shadow:
      0 8px 20px rgba(8,111,201,.2);
  }


  .mobile-button.secondary{
    background:rgba(255,255,255,.75);

    color:#0b527c;

    border:1.5px solid #1689d5;
  }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:390px){

  .mobile-menu-button{
    width:52px;
    height:52px;

    top:14px;
    right:14px;

    font-size:27px;
  }


  .mobile-menu{
    top:78px;

    left:14px;
    right:14px;
  }


  .mobile-content{
    width:92%;
  }


  .mobile-title{
    font-size:2.45rem;
  }


  .mobile-tagline{
    font-size:.95rem;
  }


  .mobile-subtitle{
    font-size:9px;
  }


  .mobile-buttons{
    gap:7px;
  }


  .mobile-button{
    padding:0 13px;

    font-size:10px;
  }

}


/* =========================================================
   TALL PHONES
========================================================= */

@media(max-width:700px) and (min-height:800px){

  .mobile-content{
    top:47%;
  }

}

</style>

</head>


<body>


<main class="home"
      aria-label="Fontaine Empire Home">


  <!-- =====================================================
       BACKGROUND IMAGE
  ====================================================== -->

  <img
    class="home-image"
    src="home-reference.png"
    alt="Fontaine Empire — Music to Save the World">


  <!-- =====================================================
       DESKTOP NAVIGATION

       ONLY VISIBLE ON DESKTOP
  ====================================================== -->

  <nav class="desktop-nav"
       aria-label="Main navigation">

    <a href="index.html">Home</a>

    <a href="music.html">Music</a>

    <a href="gallery.html">Gallery</a>

    <a href="artists.html">Artists</a>

    <a href="merch.html">Merch</a>

    <a href="apply.html">Apply</a>

    <a href="about.html">About</a>

    <a href="contact.html">Contact</a>

  </nav>


  <!-- =====================================================
       MOBILE HAMBURGER

       ONLY VISIBLE ON MOBILE
  ====================================================== -->

  <button
    class="mobile-menu-button"
    id="mobileMenuButton"
    type="button"
    aria-label="Open menu"
    aria-expanded="false">

    ☰

  </button>


  <!-- =====================================================
       MOBILE MENU
  ====================================================== -->

  <nav
    class="mobile-menu"
    id="mobileMenu"
    aria-label="Mobile navigation">

    <a href="index.html">Home</a>

    <a href="music.html">Music</a>

    <a href="gallery.html">Gallery</a>

    <a href="artists.html">Artists</a>

    <a href="merch.html">Merch</a>

    <a href="apply.html">Apply</a>

    <a href="about.html">About</a>

    <a href="contact.html">Contact</a>

  </nav>


  <!-- =====================================================
       MOBILE CONTENT

       This replaces the cramped desktop text on phones.
  ====================================================== -->

  <section
    class="mobile-content"
    aria-label="Fontaine Empire introduction">


    <div class="mobile-kicker">
      Independent Music Empire
    </div>


    <h1 class="mobile-title">
      FONTAINE<br>
      EMPIRE
    </h1>


    <p class="mobile-tagline">
      “Music to Save the World”
    </p>


    <p class="mobile-subtitle">
      The Sound. The Vision. The Empire.
    </p>


    <div class="mobile-buttons">

      <a
        class="mobile-button primary"
        href="apply.html">

        Submit Your Music

      </a>


      <a
        class="mobile-button secondary"
        href="about.html">

        Our Origin Story

      </a>

    </div>

  </section>


  <!-- =====================================================
       DESKTOP CLICKABLE AREAS

       These stay active on desktop.
  ====================================================== -->

  <a
    class="hotspot home-link"
    href="index.html"
    aria-label="Home">
  </a>


  <a
    class="hotspot home-link"
    href="music.html"
    aria-label="Music">
  </a>


  <a
    class="hotspot home-link"
    href="gallery.html"
    aria-label="Gallery">
  </a>


  <a
    class="hotspot home-link"
    href="artists.html"
    aria-label="Artists">
  </a>


  <a
    class="hotspot home-link"
    href="merch.html"
    aria-label="Merch">
  </a>


  <a
    class="hotspot home-link"
    href="apply.html"
    aria-label="Apply">
  </a>


  <a
    class="hotspot home-link"
    href="about.html"
    aria-label="About">
  </a>


  <a
    class="hotspot home-link"
    href="contact.html"
    aria-label="Contact">
  </a>


  <a
    class="hotspot submit-link"
    href="apply.html"
    aria-label="Submit Your Music">
  </a>


  <a
    class="hotspot origin-link"
    href="about.html"
    aria-label="Our Origin Story">
  </a>


</main>


<script>

/* =========================================================
   MOBILE MENU
========================================================= */

const menuButton =
  document.getElementById("mobileMenuButton");

const mobileMenu =
  document.getElementById("mobileMenu");


menuButton.addEventListener("click", function(){

  const opened =
    mobileMenu.classList.toggle("open");


  menuButton.setAttribute(
    "aria-expanded",
    opened
  );


  menuButton.setAttribute(
    "aria-label",
    opened
      ? "Close menu"
      : "Open menu"
  );


  menuButton.textContent =
    opened ? "×" : "☰";

});


/* =========================================================
   CLOSE MOBILE MENU AFTER SELECTING A PAGE
========================================================= */

const mobileLinks =
  mobileMenu.querySelectorAll("a");


mobileLinks.forEach(function(link){

  link.addEventListener("click", function(){

    mobileMenu.classList.remove("open");

    menuButton.textContent = "☰";

    menuButton.setAttribute(
      "aria-expanded",
      "false"
    );

    menuButton.setAttribute(
      "aria-label",
      "Open menu"
    );

  });

});


/* =========================================================
   CLOSE MENU WHEN TAPPING OUTSIDE
========================================================= */

document.addEventListener("click", function(event){

  if(
    mobileMenu.classList.contains("open") &&
    !mobileMenu.contains(event.target) &&
    !menuButton.contains(event.target)
  ){

    mobileMenu.classList.remove("open");

    menuButton.textContent = "☰";

    menuButton.setAttribute(
      "aria-expanded",
      "false"
    );

    menuButton.setAttribute(
      "aria-label",
      "Open menu"
    );

  }

});

</script>


</body>
</html>
