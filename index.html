<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FONTAINE EMPIRE | Music to Save the World</title>

<meta name="description"
content="Fontaine Empire — Music to Save the World. The Sound. The Vision. The Empire.">

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#dceeff;
  font-family:Arial,sans-serif;
}

/* =========================
   HOME
========================= */

.home{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:520px;
  overflow:hidden;
  background:#dceeff;
}

.home-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

/* =========================
   DESKTOP NAVIGATION
========================= */

.desktop-nav{
  position:absolute;
  top:3%;
  right:4%;
  z-index:20;

  display:flex;
  align-items:center;
  gap:20px;
}

.desktop-nav a{
  color:#0b527c;
  text-decoration:none;
  font-size:14px;
  font-weight:800;
}

.desktop-nav a:hover{
  color:#1689d5;
}

/* =========================
   MOBILE MENU BUTTON
========================= */

.menu-toggle{
  display:none;

  position:absolute;
  top:24px;
  right:24px;

  width:78px;
  height:78px;

  border:0;
  border-radius:18px;

  background:#ffffffee;
  color:#0b527c;

  font-size:34px;
  font-weight:bold;

  cursor:pointer;

  z-index:50;

  box-shadow:0 8px 25px rgba(11,82,124,.15);
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
  display:none;

  position:absolute;

  top:105px;
  left:5%;
  right:5%;

  background:#ffffff;

  border:1px solid #cfeaf4;
  border-radius:18px;

  box-shadow:0 15px 35px rgba(11,82,124,.18);

  overflow:hidden;

  z-index:40;
}

.mobile-menu.open{
  display:flex;
  flex-direction:column;
}

.mobile-menu a{
  padding:17px 20px;

  color:#0b527c;

  text-decoration:none;

  font-size:16px;
  font-weight:800;

  border-bottom:1px solid #e4f2f7;
}

.mobile-menu a:last-child{
  border-bottom:0;
}

.mobile-menu a:active{
  background:#e9faff;
}

/* =========================
   INVISIBLE DESKTOP HOTSPOTS
========================= */

.hotspot{
  position:absolute;
  display:block;

  z-index:10;

  background:transparent;
  border:0;
  outline:0;

  color:transparent;
  text-decoration:none;
}

.hotspot:focus-visible{
  outline:2px solid #1676c5;
  outline-offset:4px;
}

/* =========================
   DESKTOP TOP LINKS
========================= */

.home-link{
  top:3%;
  height:5.8%;
}

.home-link:nth-of-type(1){
  left:49%;
  width:5.1%;
}

.home-link:nth-of-type(2){
  left:54.7%;
  width:5%;
}

.home-link:nth-of-type(3){
  left:60%;
  width:5.8%;
}

.home-link:nth-of-type(4){
  left:66%;
  width:5.8%;
}

.home-link:nth-of-type(5){
  left:72%;
  width:5.5%;
}

.home-link:nth-of-type(6){
  left:78%;
  width:4.8%;
}

.home-link:nth-of-type(7){
  left:83.2%;
  width:5.2%;
}

.home-link:nth-of-type(8){
  left:89%;
  width:5.7%;
}

/* =========================
   DESKTOP BUTTON HOTSPOTS
========================= */

.submit-link{
  left:4%;
  top:69%;
  width:16.5%;
  height:8.5%;
}

.origin-link{
  left:21.2%;
  top:69%;
  width:14%;
  height:8.5%;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  html,
  body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    background:#dceeff;
  }

  .home{

    /*
      THIS MAKES THE MOBILE HOME
      PAGE MUCH LONGER.
    */

    width:100vw;

    min-height:100svh;
    height:100svh;

    overflow:hidden;

    background:#dceeff;
  }

  /*
    Keep the full homepage artwork
    inside the taller mobile section.
  */

  .home-image{
    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center center;
  }

  /*
    Hide desktop navigation
  */

  .desktop-nav{
    display:none;
  }

  /*
    Show mobile hamburger
  */

  .menu-toggle{
    display:block;
  }

  /*
    Remove desktop hotspots from
    controlling the mobile screen.
  */

  .home-link{
    display:none;
  }

  /*
    Mobile Submit button
  */

  .submit-link{
    display:block;

    left:7%;
    top:43%;

    width:27%;
    height:8%;

    color:transparent;
  }

  /*
    Mobile Origin Story button
  */

  .origin-link{
    display:block;

    left:31%;
    top:43%;

    width:27%;
    height:8%;

    color:transparent;
  }

}

/* =========================
   SMALLER PHONES
========================= */

@media(max-width:430px){

  .menu-toggle{
    top:22px;
    right:20px;

    width:68px;
    height:68px;

    border-radius:17px;

    font-size:30px;
  }

  .mobile-menu{
    top:100px;
    left:4%;
    right:4%;
  }

  .mobile-menu a{
    padding:16px 18px;
    font-size:15px;
  }

}

</style>
</head>

<body>

<main class="home" aria-label="Fontaine Empire Home">

  <!-- HOMEPAGE IMAGE -->

  <img
    class="home-image"
    src="home-reference.png"
    alt="Fontaine Empire homepage — Music to Save the World"
  >


  <!-- =========================
       DESKTOP NAVIGATION
  ========================== -->

  <nav class="desktop-nav">

    <a href="index.html">Home</a>
    <a href="music.html">Music</a>
    <a href="gallery.html">Gallery</a>
    <a href="artists.html">Artists</a>
    <a href="merch.html">Merch</a>
    <a href="apply.html">Apply</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>

  </nav>


  <!-- =========================
       MOBILE MENU BUTTON
  ========================== -->

  <button
    class="menu-toggle"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
  >
    ☰
  </button>


  <!-- =========================
       MOBILE MENU
  ========================== -->

  <div class="mobile-menu">

    <a href="index.html">Home</a>

    <a href="music.html">Music</a>

    <a href="gallery.html">Gallery</a>

    <a href="artists.html">Artists</a>

    <a href="merch.html">Merch</a>

    <a href="apply.html">Apply</a>

    <a href="about.html">About</a>

    <a href="contact.html">Contact</a>

  </div>


  <!-- =========================
       DESKTOP / IMAGE HOTSPOTS
  ========================== -->

  <a
    class="hotspot home-link"
    href="index.html"
    aria-label="Home"
  >
    Home
  </a>

  <a
    class="hotspot home-link"
    href="music.html"
    aria-label="Music"
  >
    Music
  </a>

  <a
    class="hotspot home-link"
    href="gallery.html"
    aria-label="Gallery"
  >
    Gallery
  </a>

  <a
    class="hotspot home-link"
    href="artists.html"
    aria-label="Artists"
  >
    Artists
  </a>

  <a
    class="hotspot home-link"
    href="merch.html"
    aria-label="Merch"
  >
    Merch
  </a>

  <a
    class="hotspot home-link"
    href="apply.html"
    aria-label="Apply"
  >
    Apply
  </a>

  <a
    class="hotspot home-link"
    href="about.html"
    aria-label="About"
  >
    About
  </a>

  <a
    class="hotspot home-link"
    href="contact.html"
    aria-label="Contact"
  >
    Contact
  </a>


  <!-- =========================
       BUTTON LINKS
  ========================== -->

  <a
    class="hotspot submit-link"
    href="apply.html"
    aria-label="Submit Your Music"
  >
    Submit Your Music
  </a>

  <a
    class="hotspot origin-link"
    href="about.html"
    aria-label="Our Origin Story"
  >
    Our Origin Story
  </a>

</main>


<script>

const toggle = document.querySelector(".menu-toggle");
const mobileMenu = document.querySelector(".mobile-menu");

if(toggle && mobileMenu){

  toggle.addEventListener("click", function(){

    const isOpen =
      mobileMenu.classList.toggle("open");

    toggle.setAttribute(
      "aria-expanded",
      isOpen
    );

    toggle.setAttribute(
      "aria-label",
      isOpen ? "Close menu" : "Open menu"
    );

    toggle.textContent =
      isOpen ? "×" : "☰";

  });

}


/* Close menu when a link is selected */

document.querySelectorAll(".mobile-menu a").forEach(link => {

  link.addEventListener("click", () => {

    mobileMenu.classList.remove("open");

    toggle.setAttribute(
      "aria-expanded",
      "false"
    );

    toggle.setAttribute(
      "aria-label",
      "Open menu"
    );

    toggle.textContent = "☰";

  });

});

</script>

</body>
</html>
